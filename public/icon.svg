<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  <g transform="translate(96, 96)">
    <rect x="16" y="16" width="130" height="130" rx="24" fill="url(#accentGrad)" filter="url(#glow)" />
    <rect x="174" y="16" width="130" height="80" rx="20" fill="white" fill-opacity="0.9" />
    <rect x="174" y="112" width="130" height="192" rx="24" fill="url(#accentGrad)" fill-opacity="0.85" />
    <rect x="16" y="162" width="130" height="142" rx="20" fill="white" fill-opacity="0.85" />
    <line x1="44" y1="200" x2="118" y2="200" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <line x1="44" y1="230" x2="98" y2="230" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <line x1="44" y1="260" x2="110" y2="260" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  </g>
